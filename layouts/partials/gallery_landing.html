{{- $original := resources.Get .image -}}

{{/* Create responsive cropped versions for the grid */}}
{{- $thumb := $original.Fill "360x250 smart" -}}
{{- $medium := $original.Fill "720x500 smart" -}}
{{- $large := $original.Fill "1200x800 smart" -}}

<article>
  <!-- Link points to the original (uncropped) -->
  <a href="{{ $original.RelPermalink }}" class="image">
    <picture>
      <source srcset="{{ $large.RelPermalink }}" media="(min-width: 1024px)">
      <source srcset="{{ $medium.RelPermalink }}" media="(min-width: 600px)">
      <img 
        src="{{ $thumb.RelPermalink }}" 
        alt="{{ .title }}" 
        loading="lazy" 
        decoding="async"
      >
    </picture>
  </a>

  <div class="caption">
    <h3>{{ .title }}</h3>
    <p>{{ .content }}</p>
    <ul class="actions fixed">
      <li><span class="button small">{{ .button }}</span></li>
    </ul>
  </div>
</article>
