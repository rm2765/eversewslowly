<script>
document.addEventListener('DOMContentLoaded', function() {
    const hamburger = document.getElementById('hamburger');
    const mainNav = document.getElementById('mainNav');
    const body = document.body;

    if (hamburger && mainNav) {
        hamburger.addEventListener('click', function() {
            hamburger.classList.toggle('active');
            mainNav.classList.toggle('active');
            body.classList.toggle('menu-open');
        });

        
        const navLinks = mainNav.querySelectorAll('a');
        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                if (window.innerWidth <= 768) {
                    hamburger.classList.remove('active');
                    mainNav.classList.remove('active');
                    body.classList.remove('menu-open');
                }
            });
        });

        
        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768) {
                if (!mainNav.contains(event.target) && !hamburger.contains(event.target)) {
                    hamburger.classList.remove('active');
                    mainNav.classList.remove('active');
                    body.classList.remove('menu-open');
                }
            }
        });

        
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                hamburger.classList.remove('active');
                mainNav.classList.remove('active');
                body.classList.remove('menu-open');
            }
        });
    }

    
    function handleSearch(searchInput) {
        const query = searchInput.value.trim();
        if (query) {
            
            window.location.href = "http:\/\/localhost:1313\//search?q=" + encodeURIComponent(query);
        }
    }

    
    const desktopSearchButton = document.getElementById('desktopSearchButton');
    const desktopSearchInput = document.getElementById('desktopSearchInput');
    
    if (desktopSearchButton && desktopSearchInput) {
        desktopSearchButton.addEventListener('click', function(e) {
            e.preventDefault();
            handleSearch(desktopSearchInput);
        });

        desktopSearchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch(this);
            }
        });
    }

    
    const mobileSearchButton = document.getElementById('mobileSearchButton');
    const mobileSearchInput = document.getElementById('mobileSearchInput');
    
    if (mobileSearchButton && mobileSearchInput) {
        mobileSearchButton.addEventListener('click', function() {
            handleSearch(mobileSearchInput);
        });

        mobileSearchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch(this);
            }
        });
    }
});
</script>
