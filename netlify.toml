[build]
command = "hugo --gc --cleanDestinationDir --ignoreCache --minify"
publish = "public"

[build.environment]
HUGO_VERSION = "0.145.0"

## -----------------------------------------------
## Context-specific builds
## -----------------------------------------------

[context.branch-deploy]
command = "hugo --gc --cleanDestinationDir --ignoreCache -F -b $DEPLOY_PRIME_URL"

[context.deploy-preview]
command = "hugo --gc --cleanDestinationDir --ignoreCache -F -b $DEPLOY_PRIME_URL"

[context.production]
command = "hugo --gc --cleanDestinationDir --ignoreCache --minify"

[context.production.environment]
HUGO_ENV = "production"