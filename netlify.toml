[build]
command = "hugo --minify"  # Added --minify flag
publish = "public"

[build.environment]
HUGO_VERSION = "0.145.0"

## -----------------------------------------------
## Context-specific builds
## -----------------------------------------------
[context.branch-deploy]
command = "hugo -F -b $DEPLOY_PRIME_URL"

[context.deploy-preview]
command = "hugo -F -b $DEPLOY_PRIME_URL"

[context.production]
command = "hugo --minify"  # Ensure minification in production

[context.production.environment]
HUGO_ENV = "production"